[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotatebench"
version = "0.1.0"
description = "Research package: annotation strategy benchmarking with learning curves"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "rich",
    "tqdm",
    "datasets",
]

[tool.setuptools.packages.find]
where = ["src"]
